<app-section-header [header]="'Ficha BPIN'" [centered]="false">
  <div class="flex font-inter font-normal leading-6 text-[#6B7280] mx-8">
    Generar oferta tecnológica y conocimiento por parte de los productores para la adaptación y mitigación del cambio climático.
  </div>
  <div class="mx-8">
    <p-tabs [value]="1">
      <p-tablist>
        @for (tab of fichaBpinData(); track tab.id) {
          @let index = $index + 1;
          <p-tab (click)="setCurrentObjective($index)" [value]="tab.id">Objetivo {{ index }}</p-tab>
        }
      </p-tablist>
    </p-tabs>
    <app-table-ficha-bpin [currentObjective]="currentObjective"></app-table-ficha-bpin>

  </div>
</app-section-header>
