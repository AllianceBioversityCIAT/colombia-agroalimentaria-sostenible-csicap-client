<p-table [value]="dates()" [tableStyle]="{ 'min-width': '60rem' }">
  <ng-template #header>
    <tr>
      <th pSortableColumn="corte" style="width: 20%">Corte <p-sortIcon field="corte" /></th>
      <th pSortableColumn="finicio" style="width: 20%">Fecha de inicio <p-sortIcon field="finicio" /></th>
      <th pSortableColumn="ffin" style="width: 20%">Fecha de fin (corte) <p-sortIcon field="ffin" /></th>
      <th pSortableColumn="estado" style="width: 20%">Estado <p-sortIcon field="estado" /></th>
      <th pSortableColumn="dclose" style="width: 20%">Días de cierre <p-sortIcon field="dclose" /></th>
    </tr>
  </ng-template>
  <ng-template #body let-product>
    <tr>
      <td>{{ product.corte }}</td>
      <td>{{ product.fechaInicio }}</td>
      <td>{{ product.fechaFin }}</td>
      <td>
        <span class="{{ product.stateClass }} text-white px-2 py-1 text-xs rounded-[12px] max-content">{{ product.estadoCase }}</span>
      </td>
      <td>{{ product.diasRestantes }} días</td>
    </tr>
  </ng-template>
</p-table>
