<p-table [value]="users()" [tableStyle]="{ 'min-width': '60rem' }">
  <ng-template #header>
    <tr>
      @for (col of columns(); track col['field']) {
      <th pSortableColumn="col['field']" [style]="col['styles']">{{ col['header'] }} <p-sortIcon field="col['field']" /></th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-product>
    <tr>
      @for (col of columns(); track col['field']) {
      <td>{{ product[col['field']] }}</td>
      }
    </tr>
  </ng-template>
</p-table>
