<app-section-header header="Usuarios" [centered]="false">
  <div class="mx-6">
    <div actions>
      <p-button icon="pi pi-users" label="Crear usuario" severity="primary" size="small" [disabled]="true" />
    </div>
    <div class="flex px-5 py-2">
      <div class="flex gap-4 justify-space-between w-full">
        <p-select
          #organizationFilter
          (onChange)="setOrganizationSelected($event)"
          [options]="this.organizationsIds()"
          optionLabel="nombre_corto"
          placeholder="Organización"
          class="w-full md:w-56" />
        <p-select
          #roleFilter
          (onChange)="setRoleSelected($event)"
          [options]="this.roles()"
          optionLabel="nombre"
          placeholder="Rol"
          class="w-full md:w-56" />
        <p-select
          #gcfComponenteFilter
          (onChange)="setGCFComponenteSelected($event)"
          [options]="this.gcfComponentesIds()"
          optionLabel="nombre"
          placeholder="Eje"
          class="w-full md:w-56" />
      </div>

      <p-button (click)="clearFilters()" icon="pi pi-filter-slash" label="Limpiar" variant="text" severity="secondary" />
    </div>
    <div class="border-b border-gray-300 my-4"></div>
    <p-table
      [value]="users()"
      [rows]="5"
      [rowsPerPageOptions]="[5, 10, 25, 50]"
      [paginator]="true"
      [tableStyle]="{ 'min-width': '60rem' }"
      showGridlines>
      <ng-template #header>
        <tr>
          @for (col of columns(); track col['field']) {
          <th
            class="text-base p-3 text-white"
            [class.rounded-tl-lg]="$index === 0"
            style="background-color: #f5f6fa"
            [pSortableColumn]="col['field']"
            [style]="col['styles']">
            {{ col['header'] }} <p-sortIcon [field]="col['field']" [style]="{ 'margin-left': '0.5rem' }" />
          </th>
          }
          <th class="text-base p-3 text-white rounded-tr-lg" style="background-color: #f5f6fa">Acciones</th>
        </tr>
      </ng-template>
      <ng-template #body let-product>
        <tr>
          @for (col of columns(); track col['field']) {
          <td>{{ product[col['field']] }}</td>
          }
          <td>
            <div class="flex gap-2">
              <p-button icon="pi pi-eye" [rounded]="true" severity="info" [outlined]="true" size="small" />
              <p-button icon="pi pi-pen-to-square" [rounded]="true" severity="success" [outlined]="true" />
              <p-button icon="pi pi-trash" [rounded]="true" severity="danger" [outlined]="true" />
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</app-section-header>
