<app-section-header header="Usuarios" [centered]="false">
  <div class="mx-6">

    <p-button
    icon="pi pi-users"
    label="Crear usuario"
    severity="primary"
    size="small"
    (click)="openDrawer()">
  </p-button>

  <app-user-form [visible]="visible()"></app-user-form>

    <div class="flex py-2">
      <div class="flex gap-4 justify-space-between w-full">
        <p-select
          #organizationFilter
          (onChange)="setOrganizationSelected($event)"
          [options]="this.organizationsIds()"
          optionLabel="nombre_corto"
          placeholder="Organización"
          [showClear]="true"
          class="w-full md:w-56" />
        <p-select
          #roleFilter
          (onChange)="setRoleSelected($event)"
          [options]="this.roles()"
          optionLabel="nombre"
          placeholder="Rol"
          [showClear]="true"
          class="w-full md:w-56" />
        <p-select
          #gcfComponenteFilter
          (onChange)="setGCFComponenteSelected($event)"
          [options]="this.gcfComponentesIds()"
          optionLabel="nombre"
          placeholder="Eje"
          [showClear]="true"
          class="w-full md:w-30" />
        <p-iconfield iconPosition="left">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input
            pInputText
            type="text"
            [(ngModel)]="searchInput"
            (ngModelChange)="usersTable.filterGlobal($event, 'contains')"
            placeholder="Buscar" />
        </p-iconfield>
      </div>

      <p-button (click)="clearFilters()" [disabled]="!hasFilters" icon="pi pi-filter-slash" label="Limpiar" variant="text" severity="secondary" />
    </div>
    <div class="border-b border-gray-300 my-4"></div>
    <p-table
      #usersTable
      [value]="users()"
      [rows]="5"
      [rowsPerPageOptions]="[5, 10, 25, 50]"
      [paginator]="true"
      [loading]="isTableLoading()"
      [globalFilterFields]="['persona_nombre', 'persona_apellido', 'organizacion_nombre_corto', 'persona_email', 'rol_nombre', 'nombre']"
      showGridlines>
      <ng-template #header>
        <tr>
          @for (col of columns(); track col['field']) {
            <th
              class="text-base p-3 text-white"
              [class.rounded-tl-lg]="$index === 0"
              style="background-color: #f5f6fa"
              [pSortableColumn]="col['field']"
              [style]="col['styles']">
              {{ col['header'] }} <p-sortIcon [field]="col['field']" [style]="{ 'margin-left': '0.5rem' }" />
            </th>
          }
          <th class="text-base p-3 text-white rounded-tr-lg" style="background-color: #f5f6fa">Acciones</th>
        </tr>
      </ng-template>

      <ng-template #body let-product>
        <tr>
          @for (col of columns(); track col['field']) {
            <td>{{ product[col['field']] }}</td>
          }
          <td>
            <div class="flex gap-2">
              <p-button icon="pi pi-eye" [rounded]="true" severity="info" [outlined]="true" size="small" />
              <p-button icon="pi pi-pen-to-square" [rounded]="true" severity="success" [outlined]="true" />
              <p-button icon="pi pi-trash" [rounded]="true" severity="danger" [outlined]="true" />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="100%" class="text-center">No se encontraron usuarios.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</app-section-header>
