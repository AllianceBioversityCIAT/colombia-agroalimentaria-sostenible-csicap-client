<div class="absolute right-6 top-3.5">
  <p-button icon="pi pi-users" label="Crear usuario" severity="primary" size="small" (click)="openDrawer()"> </p-button>
</div>

<p-drawer
  header="Crear usuario"
  [visible]="visible()"
  position="right"
  [modal]="true"
  (onHide)="closeDrawer()"
  styleClass="!w-full md:!w-80 lg:!w-[24rem] 2xl:!w-[30rem]">
  <div class="grid gap-6">
    <div class="grid gap-4">
      <span class="font-medium text-base leading-[120%] font-inter text-[#0B655B]">¿Eres usuario CGIAR?</span>

      <div class="grid gap-2">
        <div class="flex gap-2">
          <p-radioButton name="option" value="yes" [(ngModel)]="selectedOption" inputId="yes" />
          <label for="yes">Sí</label>
        </div>

        <div class="flex gap-2">
          <p-radioButton name="option" value="no" [(ngModel)]="selectedOption" inputId="no" />
          <label for="no">No</label>
        </div>
      </div>
    </div>

    <app-input label="Nombre" placeholder="Ingrese el nombre completo" />

    <app-input label="Apellido" placeholder="Ingrese el apellido completo" />

    <app-select label="Organización" placeholder="Seleccionar organización" />

    <app-input
      label="Correo electrónico"
      placeholder="Ingrese el correo electrónico"
      [pattern]="'email'"
      inputCaption="La contraseña será enviada automaticamente al correo electrónico del usuario." />

    <app-select label="Rol" placeholder="Seleccionar rol" />

    <app-select label="Eje" placeholder="Seleccionar eje" />

    <p-button label="Crear" severity="primary" size="small"> </p-button>
  </div>
</p-drawer>
